<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0078d4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>資格別予測問題 | FE合格作戦</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./cert_quiz.css">
</head>
<body>
<div class="app-shell cert-shell">
<header class="app-header"><div><p class="eyebrow">FE合格作戦｜資格別問題</p><h1 id="certTitle">問題を準備しています</h1></div><a class="cert-home" href="./index.html">HOME</a></header>
<main>
<section id="certSetupView" class="cert-view">
  <div class="hero-card">
    <span class="mode-kicker" id="certTag">第1回オリジナル問題</span>
    <h2 id="certSubtitle"></h2>
    <p id="certOfficial"></p>
  </div>
  <div class="stats-card cert-form">
    <h3>学習条件</h3>
    <div class="cert-field"><label for="certCount">出題数</label><select id="certCount"></select></div>
    <div class="cert-field"><label for="certCategory">出題分野</label><select id="certCategory"></select></div>
    <p id="certPreview" class="cert-info" aria-live="polite"></p>
    <button id="certStartBtn" class="primary full" type="button">この条件で出題開始</button>
    <button id="certNewBtn" class="secondary full" type="button" hidden>保存中の回答を破棄して新しい問題を開始</button>
    <button id="certReviewBtn" class="secondary full" type="button">直前の誤答・解答を復習する</button>
  </div>
  <div class="stats-card cert-form">
    <h3>学習上の注意</h3>
    <p id="certNotice" class="cert-info"></p>
    <p class="cert-info">問題文は公式シラバスを参考にした独自問題であり、公式の過去問題を転載したものではありません。</p>
  </div>
  <div class="cert-links">
    <a href="./cert_quiz.html?cert=itil5">ITIL Foundation 5</a>
    <a href="./cert_quiz.html?cert=ap_a">応用情報 A</a>
    <a href="./cert_quiz.html?cert=ap_b">応用情報 B（記述）</a>
    <a href="./cert_quiz.html?cert=linuc101">LinuC 101</a>
    <a href="./cert_quiz.html?cert=linuc102">LinuC 102</a>
  </div>
</section>
<section id="certExamView" class="cert-view" hidden>
  <div class="cert-toolbar"><span id="certProgress"></span><span id="certTimer" role="timer"></span></div>
  <div class="cert-progress"><div id="certProgressBar"></div></div>
  <article class="question-card cert-question">
    <div class="meta"><span class="badge" id="certBadge">科目</span><span class="badge soft" id="certTopic">分野</span></div>
    <h2 id="certQuestionText"></h2>
    <div id="certAnswers" class="options" role="group" aria-label="選択肢"></div>
    <div id="certWritten" hidden>
      <label for="certWrittenAnswer">記述解答</label>
      <textarea id="certWrittenAnswer" rows="6" placeholder="根拠・計算式を含めて記入してください"></textarea>
      <p class="cert-info">記述式は模範解答と自己照合する方式です。自動採点しません。</p>
    </div>
  </article>
  <div class="cert-navigation">
    <button id="certPrevBtn" class="secondary" type="button">前の問題</button>
    <button id="certNextBtn" class="primary" type="button">次の問題</button>
  </div>
  <button id="certSubmitBtn" class="submit" type="button">回答を提出して結果を確認</button>
  <button id="certAbortBtn" class="secondary full" type="button">学習条件に戻る（入力は保存）</button>
</section>
<section id="certResultView" class="cert-view" hidden>
  <div class="stats-card">
    <h2 id="certResultTitle">学習結果</h2>
    <div id="certResultSummary"></div>
  </div>
  <div id="certWrongList" class="cert-wrong-list"></div>
  <button id="certRetryWrongBtn" class="primary full" type="button" hidden>間違えた問題だけ再出題</button>
  <button id="certResultHomeBtn" class="secondary full" type="button">学習条件へ戻る</button>
</section>
</main>
</div>
<script src="./cert_questions.js"></script>
<script src="./cert_quiz.js"></script>
</body>
</html>
