<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FE合格作戦">
  <title>FE 9/6 合格作戦</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div><p class="eyebrow">FE 9/6 合格作戦</p><h1>予測問題</h1></div>
      <button id="overviewBtn" class="icon-btn" type="button" aria-label="問題一覧">☰</button>
    </header>
    <main>
      <section id="quizView">
        <div class="progress-row"><span id="counter"></span><span id="answeredCount"></span></div>
        <div class="progress"><div id="progressBar"></div></div>
        <article class="question-card">
          <div class="meta"><span id="sectionBadge" class="badge"></span><span id="categoryBadge" class="badge soft"></span><span id="importanceBadge" class="badge warn"></span></div>
          <h2 id="questionText"></h2>
          <pre id="codeBlock" class="code-block" hidden></pre>
          <div id="options" class="options"></div>
          <label class="review-row"><input id="reviewFlag" type="checkbox"><span>あとで見直す</span></label>
        </article>
        <nav class="nav-row"><button id="prevBtn" class="secondary" type="button">← 前へ</button><button id="nextBtn" class="primary" type="button">次へ →</button></nav>
        <button id="submitBtn" class="submit" type="button">回答を提出</button>
      </section>
      <section id="resultView" class="result-view" hidden>
        <h2>提出用回答</h2>
        <p>下のテキストをコピーしてChatGPTへ貼り付けてください。正解はこのアプリには入っていません。</p>
        <textarea id="resultText" readonly></textarea>
        <button id="copyBtn" class="primary full" type="button">回答をコピー</button>
        <button id="backBtn" class="secondary full" type="button">問題に戻る</button>
      </section>
      <section id="overviewView" class="overview-view" hidden>
        <div class="overview-head"><h2>問題一覧</h2><button id="closeOverviewBtn" class="icon-btn" type="button">✕</button></div>
        <div id="overviewGrid" class="overview-grid"></div>
      </section>
    </main>
  </div>
  <script src="./questions.js"></script>
  <script src="./app.js"></script>
</body>
</html>
